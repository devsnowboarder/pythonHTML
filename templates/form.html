<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tax Preparation Form</title>
    <style>
        /* 1. Global Styles & Reset */
        *, *::before, *::after {
            box-sizing: border-box; /* Ensures padding never breaks widths */
        }

        body {
            background-color: #f0f8ff;
            font-family: system-ui, -apple-system, sans-serif;
            color: ##6FC1D6;
            padding: 20px; /* Reduced for mobile */
            display: flex;
            justify-content: center;
            margin: 0;
        }

        /* 2. Form Container */
        .tax-form-container {
            background: #6FC1D6;
            width: 100%;
            max-width: 700px;
            padding: 32px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* 3. Header Styles */
        .form-header img {
            max-width: 100%;
            height: auto;
            margin-bottom: 16px;
            border-radius: 4px; /* Optional touch of polish */
        }
        .form-header h2 {
            margin: 0 0 16px 0;
            color: #111827;
        }
        .divider {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin-bottom: 24px;
        }

        /* 4. Grid Layout - Mobile First */
        .form-row {
            display: grid;
            gap: 8px; /* Tighter gap for stacked mobile view */
            margin-bottom: 20px;
        }

        label {
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="number"] {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            width: 100%;
            transition: border-color 0.2s; /* Smooth focus effect */
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        /* 5. Button Styles */
        .submit-btn {
            background-color: #2563eb;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            width: 100%; /* Full width on mobile */
        }
        .submit-btn:hover {
            background-color: #1d4ed8;
        }

        /* 6. Desktop Override (Screens 640px and wider) */
        @media (min-width: 640px) {
            body { padding: 40px; }

            .form-row {
                grid-template-columns: 120px 1fr 120px 1fr; /* 4 columns on desktop */
                gap: 16px;
                align-items: center;
            }

            label {
                text-align: right; /* Right align labels only on desktop */
            }

            .form-actions {
                display: grid;
                grid-template-columns: 120px 1fr; /* Matches the left side of the input grid */
                gap: 16px;
            }

            .submit-btn {
                grid-column: 2; /* Puts button neatly under the first input */
                width: auto;
                justify-self: start;
            }
        }
    </style>
</head>
<body>

    <div class="tax-form-container">
        <div class="form-header">
            <img src="taxpicture.jpeg" alt="Tax Preparation Header">
            <h2>Enter Your Data for Tax Preparation</h2>
            <hr class="divider">
        </div>

        <form method="POST">
            <!-- Row 1 -->
            <div class="form-row">
                <label for="first_name">First Name:</label>
                <input type="text" id="first_name" name="first_name" placeholder="e.g., Alexander" autocomplete="given-name" required>

                <label for="age">Age:</label>
                <input type="number" id="age" name="age" placeholder="e.g., 66" min="1" max="120" required>
            </div>

            <!-- Row 2 -->
            <div class="form-row">
                <label for="income">Yearly Income:</label>
                <input type="number" id="income" name="income" placeholder="e.g., 70000" min="0" required>

                <label for="ssn_income">Social Security:</label>
                <input type="number" id="ssn_income" name="ssn_income" placeholder="e.g., 10000" min="0" required>
            </div>
            <!-- Row 3 -->
             <div class="form-row">
                <p>  No Taxes on Roth IRA Income </p>

             </div>

            <!-- Submit Actions -->
            <div class="form-actions">
                <button type="submit" class="submit-btn">Submit</button>
            </div>
        </form>
    </div>

</body>
</html>
